<body>

    <div class="container text-center">
        <h1 class="text-danger text-center mt-4">Belajar pakai bootstrep</h1>
        <!-- warna Di bootstrep:
         primary (biru)
         secondary (abu-abu)
         danger(merah)
         warning (kuning)
         success (hijau)
         info (biru muda)
         dark (hitam)
         light (putih)
         -->
        <button class="btn btn-primary rounded-pill">klik saya</button>
        <button class="btn btn-secondary">klik saya</button>
        <button class="btn btn-danger">klik saya</button>
        <button class="btn btn-warning text-success">klik saya</button>
        <button class="btn btn-success">klik saya</button>
        <button class="btn btn-info">klik saya</button>
        <button class="btn btn-dark">klik saya</button>
    </div>
